name: Test Discord Webhook

on:
  workflow_dispatch:

jobs:
  test-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -f \
            -H "Content-Type: application/json" \
            -d '{"content":"**Azur Lane EN News**\nBot test successful! Future official news will appear here automatically."}' \
            "$DISCORD_WEBHOOK_URL"
