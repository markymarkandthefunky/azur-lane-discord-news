name: Test Discord Webhook

on:
  workflow_dispatch:

jobs:
  test-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          url = os.environ["DISCORD_WEBHOOK_URL"].strip()

          print("Webhook secret exists:", bool(url))
          print("Webhook starts with https:", url.startswith("https://"))
          print("Webhook length:", len(url))

          data = json.dumps({
              "content": "Azur Lane EN news bot test - setup successful!"
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com, 1.0)"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("SUCCESS - Discord returned:", response.status)
          except urllib.error.HTTPError as e:
              print("DISCORD HTTP ERROR:", e.code)
              print("DISCORD RESPONSE:", e.read().decode("utf-8", errors="replace"))
              raise
          PY
